  <line x1="265.35" y1="129.7" x2="265.35" y2="209.5" stroke="#3b9ece" stroke-width="1.5"/>
  <line x1="225.45" y1="129.7" x2="225.45" y2="209.5" stroke="#3b9ece" stroke-width="1.5"/>
