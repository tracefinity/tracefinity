  <line x1="17.95" y1="169.6" x2="157.6" y2="169.6" stroke="#3b9ece" stroke-width="1.5"/>
  <text x="87.77" y="239.5" font-size="18" fill="#e8eaed" text-anchor="middle">3.5 x 2</text>
