name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test .github/scripts/*.test.js

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: cd backend && pip install -r requirements.txt pytest build123d==0.13.0
      - name: Build CAD worker
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 make geometry
      - run: cd backend && python -m pytest

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm test
